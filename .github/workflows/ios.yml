name: Build iOS IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar iOS sin firmar
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Paddock.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Paddock-ipa
          path: Paddock.ipa
          retention-days: 14
