name: paddock
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.4
  go_router: ^17.5.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
    - assets/content/es/
    - assets/content/es/geografia/
    - assets/content/es/geografia/mapas/
    - assets/geo/
    - assets/geo/flags/
    - assets/audio/
