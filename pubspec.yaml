name: paddock
description: "Paddock: juegos de fiesta para grupos (carrera, trivia, geografía y más)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.4
  go_router: ^17.5.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards/
    - assets/content/es/
    - assets/content/es/geografia/
    - assets/content/es/geografia/mapas/
    - assets/geo/
    - assets/geo/flags/
    - assets/audio/

dependency_overrides:
  # 5.3.0 usa el bloque kotlin{} de AGP 9; el proyecto usa AGP 8.11 y no compila.
  # Quitar al subir AGP/Flutter.
  audioplayers_android: 5.2.1
